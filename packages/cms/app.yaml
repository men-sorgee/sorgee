piVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gnh-cms
  labels:
    cloud.googleapis.com/location: us-central1

spec:
  template:
    metadata:
      name: gnh-cms
      annotations:
        client.knative.dev/user-image: gcr.io/tbg-gnh/gcp-example
        run.googleapis.com/cloudsql-instances: tbg-gnh:us-central1:brotherhood
        autoscaling.knative.dev/maxScale: '100'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: 806946159244-compute@developer.gserviceaccount.com
      containers:
      - image: gcr.io/tbg-gnh/gnh-cms
        ports:
        - name: http1
          containerPort: 8055
        env:
        - name: DB_CLIENT
          value: pg
        - name: DB_PORT
          value: '5432'
        - name: DB_DATABASE
          value: guysnheat
        - name: DB_USER
          value: guysnheat
        - name: DB_PASSWORD
          value: rO8hH2cxo^D?O}
        - name: DB_HOST
          value: /cloudsql/tbg-gnh:us-central1:brotherhood
        - name: STORAGE_LOCATIONS
          value: gcs
        - name: STORAGE_GCS_DRIVER
          value: gcs
        - name: STORAGE_GCS_BUCKET
          value: gnh-static
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi