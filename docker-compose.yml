version: '3'

services:
  admin:
    container_name: gnh-admin
    build: 
      context: ./packages/admin
    depends_on:
      - cache
    env_file:
      - ./packages/admin/.env
    volumes:
      - ./packages/admin/extensions:/directus/extensions:rw
    ports:
      - 8055:8055
    environment:
      DB_HOST: 35.223.87.210
      PUBLIC_URL: https:/gnh-admin.local.guysnheat.com
  app:
    container_name: gnh-app
    build: 
      context: ./packages/app
    ports:
      - 3000:3000
    env_file:
      - ./packages/app/.env.local
      - ./packages/app/.env.production.local
        
    environment:
      AUTH0_SECRET: 9253b625557725fe9a22b89b0e9d3cd3665221bb51116a7decef241826ab4ad4
      AUTH0_BASE_URL: https://app.local.guysnheat.com
      AUTH0_ISSUER_BASE_URL: https://dev-jlzyqb1x.us.auth0.com
      AUTH0_CLIENT_ID: 06E4boGvgSj32JrP0YJDpCix39TcIEES
      AUTH0_CLIENT_SECRET: jQNc_OXz2MGPK3_SVWuKS1ZudGf7yFRAiI6Kv6gVuf8vP1f7omLMfpqXJmpkvGes
      BASE_URL: https://app.local.guysnheat.com
      API_URL: https://admin.local.guysnheat.com/graphql
  
  # Development Tools ------------------------------------------
  proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: gnh-proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./packages/proxy/data:/data:rw
      - ./packages/proxy/certificates:/etc/letsencrypt:rw
  cache:
    container_name: cache
    image: redis:6

  db:
    container_name: gnh-db
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - 8080:80
    environment:
      PGADMIN_DEFAULT_EMAIL: jason@thebrotherhoodgroup.org
      PGADMIN_DEFAULT_PASSWORD: testing
    volumes:
      - db_data:/data:rw
      
volumes:
  db_data: