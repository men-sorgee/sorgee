version: "3"

services:
  #admin:
  #  container_name: gnh-admin
  #  build:
  #    context: ./packages/admin
  #  depends_on:
  #    - cache
  #  env_file:
  #    - ./packages/admin/.env
  #  volumes:
  #    - ./packages/admin/extensions:/directus/extensions:rw
  #  ports:
  #    - 8055:8055
  #  environment:
  #    DB_HOST: 35.223.87.210
  #    PUBLIC_URL: http://127.0.0.1:8055
  app:
    image: node:16
    container_name: gnh-app
    working_dir: /app
    restart: unless-stopped
    entrypoint: /bin/sh -c "yarn install && yarn dev"
    environment:
      BUILD: "build"
    volumes:
      - ./packages/app:/app:rw
      - app_modules:/app/node_modules:rw
      - app_build:/app/build:rw

    ports:
      - 3001:3000
    env_file:
      - ./packages/app/.env.docker

  # Development Tools ------------------------------------------
  proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: gnh-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./packages/proxy/data:/data:rw
      - ./packages/proxy/certificates:/etc/letsencrypt:rw
    environment:
      DB_SQLITE_FILE: "/data/database.sqlite"
      DISABLE_IPV6: "true"
  cache:
    container_name: cache
    image: redis:6

  db:
    container_name: gnh-db
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - 8080:80
    environment:
      PGADMIN_DEFAULT_EMAIL: jason@thebrotherhoodgroup.org
      PGADMIN_DEFAULT_PASSWORD: testing
    volumes:
      - db_data:/data:rw

volumes:
  db_data:
  app_build:
  app_modules:
